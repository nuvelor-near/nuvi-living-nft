[package]
name = "nuvelor-nft"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/urw13/NUVELOR"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "=1.6.1", features = ["derive"] }
near-sdk = { version = "=5.26.1", features = ["legacy"] }
near-contract-standards = "=5.26.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[dev-dependencies]
near-sdk = { version = "=5.26.1", features = ["legacy", "unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.20.3-rust-1.86.0"
image_digest = "sha256:a84b7c401a856b6bbbe1975f235b6a8011540a24dfbde248531cccb4b2fdbadf"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
